name: App checks
# Uses Node directly. No containers or local Supabase service.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Format, lint, types, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build-only placeholders. PR checks never contact a backend or need secrets.
      - name: Configure offline builds
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_SUPABASE_URL=https://build-only.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_build_placeholder
          VITE_SUPABASE_URL=https://build-only.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_build_placeholder
          ENV
      - run: npm run check
      - run: npm run test:maps
      - run: node scripts/test-database.mjs --self-test
      - run: npm run build
      - run: node scripts/check-client-bundles.mjs --self-test
      - run: node scripts/check-client-bundles.mjs
