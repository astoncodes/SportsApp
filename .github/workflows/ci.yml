name: App checks
# Uses Node directly. No containers or local Supabase service.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Format, lint, types, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint applications
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Unit tests and tooling checks
        run: npm test
      - name: Build apps and scan client bundles
        run: npm run check:bundles
        # Public placeholders only. Automatic CI never needs a backend or secrets.
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://build-only.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_build_placeholder
          VITE_SUPABASE_URL: https://build-only.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_build_placeholder
          EXPO_NO_TELEMETRY: '1'
