name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — CI here starts a full
# Supabase stack, and queueing those up wastes minutes for no information.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: tools/venue-importer
        run: uv sync --locked

      # Started before the checks that need it. The runner already has Docker.
      - name: Start Supabase
        run: npx supabase start

      # Config the apps need in order to typecheck and build. These are the
      # well-known local development keys, identical on every machine and
      # meaningless outside a local container — not secrets.
      - name: Write .env
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "VITE_SUPABASE_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "VITE_SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_DB_URL=$(npx supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "OVERPASS_USER_AGENT=dropin-importer/ci (contact: ci@example.invalid)"
          } > .env

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Database tests
        run: npm run db:test

      # The generated types are committed so editors and CI agree without a
      # database. This catches a migration landing without a regeneration.
      - name: Generated types are current
        run: |
          npm run db:types
          if ! git diff --exit-code -- packages/database-types/src/database.types.ts; then
            echo "::error::Generated database types are stale. Run 'npm run db:types' and commit."
            exit 1
          fi

      - name: Build clients
        run: npm run build

      # Guards the rule that no server-side credential reaches a client bundle.
      # Self-test first, so a check that has silently stopped working fails
      # loudly instead of passing everything.
      - name: No credentials in client bundles
        run: |
          node scripts/check-client-bundles.mjs --self-test
          node scripts/check-client-bundles.mjs

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
