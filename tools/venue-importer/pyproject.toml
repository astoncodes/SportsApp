[project]
name = "venue-importer"
version = "0.1.0"
description = "Imports OpenStreetMap sport venues into the Drop In staging tables."
requires-python = ">=3.12"

# Deliberately small. The importer builds a query string, POSTs it, loops over
# the results, and writes rows — there is no framework here, and there should
# not be one.
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[project.scripts]
venue-importer = "venue_importer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venue_importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
